<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>เข้าสู่ระบบ | IGPThai</title>
	<link rel="stylesheet" href="../assets/css/corporate/app.min.css">
	<link href="../plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link href="../plugins/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
	<style>
		body {
			background: linear-gradient(135deg, #43499b 0%, #2f9194 100%);
			font-family: 'Sarabun', 'Segoe UI', Arial, sans-serif;
			color: #43499b;
			min-height: 100vh;
		}
		.login-container {
			max-width: 400px;
			margin: 64px auto;
			background: #fff;
			border-radius: 18px;
			box-shadow: 0 4px 24px rgba(67,73,155,0.12);
			padding: 40px 32px;
		}
		.login-logo {
			display: block;
			margin: 0 auto 24px auto;
			height: 56px;
		}
		.form-label {
			font-weight: 600;
			color: #43499b;
		}
		.btn-login {
			background: #ed1c24;
			color: #fff;
			font-weight: 600;
			border: none;
			border-radius: 8px;
			padding: 10px 0;
			font-size: 1.08em;
		}
		.btn-login:hover {
			background: #2f9194;
		}
		.login-footer {
			text-align: center;
			margin-top: 32px;
			color: #fff;
			font-size: 1em;
		}
	</style>
</head>
<body>
	<div class="login-container">
		<img src="https://www.igpthai.org/wp-content/uploads/2021/06/logo.png" alt="IGPThai Logo" class="login-logo">
		<h2 class="text-center mb-4" style="color:#2f9194;font-weight:700;">เข้าสู่ระบบ</h2>
		<form>
			<div class="mb-3">
				<label for="username" class="form-label">ชื่อผู้ใช้</label>
				<input type="text" class="form-control" id="username" placeholder="กรอกชื่อผู้ใช้" required>
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">รหัสผ่าน</label>
				<input type="password" class="form-control" id="password" placeholder="กรอกรหัสผ่าน" required>
			</div>
			<div class="d-flex justify-content-between align-items-center mb-3">
				<div>
					<input type="checkbox" id="remember" class="form-check-input">
					<label for="remember" class="form-check-label">จดจำฉัน</label>
				</div>
				<a href="#" style="color:#ed1c24;font-size:0.98em;">ลืมรหัสผ่าน?</a>
			</div>
			<button type="submit" class="btn btn-login w-100 mb-2"><i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ</button>
			<a href="index.html" class="btn w-100" style="background:#43499b;color:#fff;font-weight:600;border-radius:8px;"><i class="bi bi-arrow-left"></i> กลับหน้าแรก</a>
		</form>
	</div>
	<div class="login-footer">
		&copy; 2025 สถาบันส่งเสริมการบริหารกิจการบ้านเมืองที่ดี (IGPThai)
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
